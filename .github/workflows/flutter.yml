name: Flutter App

on:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "iOS-Build signieren und zu TestFlight hochladen"
        type: boolean
        default: false

concurrency:
  group: flutter-${{ github.ref }}-${{ inputs.testflight || 'ci' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

defaults:
  run:
    working-directory: flutter_app

jobs:
  check:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Supabase-Konfiguration schreiben
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: scripts/write_dart_defines.sh
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=dart_defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: alcoholtracker-android-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # macOS-Minuten sind teuer (privates Repo: Faktor 10). Deshalb nur auf main,
  # bei manuellem Start oder wenn die Commit-Message "[ios]" enthaelt.
  ios:
    name: iOS ${{ inputs.testflight && '→ TestFlight' || '(unsigniert)' }}
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Supabase-Konfiguration schreiben
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          REQUIRE_SUPABASE: ${{ inputs.testflight && 'true' || 'false' }}
        run: scripts/write_dart_defines.sh
      - name: Build (ohne Signatur)
        if: ${{ !inputs.testflight }}
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define-from-file=dart_defines.json
      - name: Signieren & zu TestFlight hochladen
        if: ${{ inputs.testflight }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/ios_testflight.sh
